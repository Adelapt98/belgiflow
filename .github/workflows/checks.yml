name: Offline checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BELGIFLOW_TEST_DSN: postgresql://postgres@127.0.0.1:55432/postgres?connect_timeout=5
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt && pip install -e '.[dev]' --no-deps && pip install pytest==9.2.0
      - run: python -m pytest tests -q
      - run: python scripts/verify_dagster.py
      - run: dbt parse --project-dir warehouse_dbt --profiles-dir warehouse_dbt --target redshift --no-partial-parse
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt && python -m pip install -e . --no-deps
      - run: python -m belgiflow.platform.cli run --pipeline 02_daily_shipment_ingestion --source-mode fixtures --shipments 100
      - run: docker run --rm -v "$PWD/jobs:/jobs:ro" -v "$PWD/data:/data" apache/spark:3.5.3 /opt/spark/bin/spark-submit --master 'local[2]' /jobs/glue_compact.py --INPUT_PATH /data/platform/partitions/2026-01-03/accepted_events.parquet --OUTPUT_PATH /tmp/compacted --EXPECTED_SHIPMENTS 100
