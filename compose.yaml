services:
  dagster:
    build: .
    image: belgiflow:local
    profiles: [ui]
    command: [dagster, dev, -m, belgiflow.definitions, -h, 0.0.0.0, -p, "3000"]
    environment:
      DAGSTER_HOME: /app/data/dagster
      PYTHONPATH: /app/src
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./warehouse_dbt:/app/warehouse_dbt:ro
      - ./jobs:/app/jobs:ro
  spark-worker:
    image: apache/spark:3.5.3
    profiles: [ui]
    user: root
    entrypoint: [python3, /jobs/spark_worker.py]
    environment:
      BELGIFLOW_SPARK_QUEUE: platform/spark_queue
    volumes:
      - ./data:/data
      - ./jobs:/jobs:ro
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
