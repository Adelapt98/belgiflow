belgiflow_platform:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('BELGIFLOW_WAREHOUSE', 'data/platform/warehouse.duckdb') }}"
      schema: main
      threads: 1
    serving:
      type: duckdb
      path: "{{ env_var('BELGIFLOW_SERVING_DATABASE', 'data/platform/serving.duckdb') }}"
      schema: analytics
      threads: 1
    redshift:
      type: redshift
      host: "{{ env_var('BELGIFLOW_REDSHIFT_HOST', 'not-configured.redshift-serverless.amazonaws.com') }}"
      port: 5439
      dbname: "{{ env_var('BELGIFLOW_REDSHIFT_DATABASE', 'belgiflow') }}"
      schema: analytics
      user: "{{ env_var('BELGIFLOW_REDSHIFT_USER', 'IAM:not-configured') }}"
      password: "{{ env_var('BELGIFLOW_REDSHIFT_PASSWORD', '') }}"
      sslmode: require
      threads: 1
