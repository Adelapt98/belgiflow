[project]
name = "belgiflow"
version = "0.1.0"
description = "Belgian geospatial batch logistics platform"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.4,<2", "pyarrow>=20,<24", "shapely>=2.1,<3", "requests>=2.32,<3", "pyproj>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
orchestration = ["dagster>=1.11,<2", "dagster-webserver>=1.11,<2"]
analytics = ["dbt-duckdb>=1.9,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
spark = ["pyspark>=3.5,<3.6"]
cloud = ["boto3>=1.40,<2"]
redshift = ["dbt-redshift>=1.9,<2"]

[project.scripts]
belgiflow = "belgiflow.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
belgiflow = ["resources/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
